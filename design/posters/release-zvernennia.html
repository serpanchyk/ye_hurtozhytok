<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1024" />
    <title>єГуртожиток · звернення</title>
    <!--
      Poster for the release with «Звернення», «Дошка» and «Послуги».
      1024×1280 (4:5). Open as is for variant A, with #b for variant B.
      Render: google-chrome --headless=new --hide-scrollbars
        --window-size=1024,1280 --screenshot=release-zvernennia.png
        file://…/release-zvernennia.html
    -->
    <style>
      @font-face {
        font-family: "Fixel Text";
        src: url("../stickers/FixelText-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Fixel Text";
        src: url("../stickers/FixelText-SemiBold.woff2") format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "Fixel Text";
        src: url("../stickers/FixelText-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Fixel Display";
        src: url("../stickers/FixelDisplay-Black.woff2") format("woff2");
        font-weight: 900;
      }

      :root {
        --ink: #101217;
        --ink-2: #2b2f38;
        --muted: #525a6b;
        --faint: #626a7c;
        --struck: #9aa1ae;
        --mine: #2a37d8;
        --mine-deep: #1b23a3;
        --now: #e5484d;
        --mint-dot: #7ff0da;
        --font: "Fixel Text", -apple-system, system-ui, sans-serif;
        --font-display: "Fixel Display", "Fixel Text", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1280px;
        overflow: hidden;
        background: #eef1f8;
        -webkit-font-smoothing: antialiased;
      }

      .poster {
        position: relative;
        width: 1024px;
        height: 1280px;
        overflow: hidden;
        padding: 64px 82px 0;
        font-family: var(--font);
        color: var(--ink);
        background:
          radial-gradient(
            56% 40% at 2% 0%,
            rgb(190 236 219 / 0.95),
            transparent 72%
          ),
          radial-gradient(
            46% 42% at 102% 30%,
            rgb(200 219 250 / 0.95),
            transparent 72%
          ),
          radial-gradient(
            52% 34% at 8% 84%,
            rgb(228 218 246 / 0.75),
            transparent 72%
          ),
          radial-gradient(
            40% 30% at 96% 98%,
            rgb(214 228 250 / 0.7),
            transparent 72%
          ),
          linear-gradient(180deg, #f4f6fb 0%, #eef1f8 100%);
      }

      /* brand */
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      /* what is new, a glass pill like the app's tiles */
      .new {
        display: inline-flex;
        align-items: center;
        height: 50px;
        padding: 0 22px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.62);
        box-shadow:
          inset 0 1px 1px rgb(255 255 255 / 0.95),
          inset 0 -1px 1px rgb(255 255 255 / 0.35),
          0 1px 2px rgb(16 18 23 / 0.05),
          0 16px 30px -18px rgb(31 45 90 / 0.3);
        font-weight: 600;
        font-size: 20px;
        letter-spacing: -0.01em;
        color: var(--muted);
        white-space: nowrap;
      }
      .new b {
        font-weight: 700;
        color: var(--ink);
        margin-right: 0.3em;
      }
      .mark {
        width: 64px;
        height: 64px;
        flex: none;
        filter: drop-shadow(0 8px 14px rgb(16 18 23 / 0.28));
      }
      .wordmark {
        font-weight: 700;
        font-size: 38px;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      /* headline */
      h1 {
        margin: 44px 0 0 -6px;
        font-family: var(--font-display);
        font-weight: 900;
        font-size: var(--h1-size, 140px);
        line-height: 0.88;
        letter-spacing: -0.045em;
        color: var(--ink);
      }
      h1 span {
        display: block;
        white-space: nowrap;
      }
      .struck {
        position: relative;
        display: inline-block;
        color: var(--struck);
      }
      .struck::after {
        content: "";
        position: absolute;
        left: -0.045em;
        right: -0.045em;
        top: 0.52em;
        height: 0.11em;
        border-radius: 0.06em;
        background: var(--now);
        transform: rotate(-4deg);
      }

      .sub {
        margin: 28px 0 0;
        max-width: 820px;
        font-weight: 700;
        font-size: 31px;
        line-height: 1.26;
        letter-spacing: -0.022em;
        color: var(--ink-2);
      }

      /* the complaint card, drawn like the booking ticket */
      .card {
        position: relative;
        overflow: hidden;
        margin-top: 44px;
        padding: 34px 44px 36px;
        border-radius: 40px;
        color: #fff;
        transform: rotate(-2deg);
        background:
          radial-gradient(
            120% 90% at 100% 0%,
            rgb(110 125 255 / 0.3),
            transparent 55%
          ),
          radial-gradient(
            80% 70% at 0% 100%,
            rgb(20 28 140 / 0.45),
            transparent 60%
          ),
          linear-gradient(155deg, #3442e6 0%, #2a37d8 45%, #1b23a3 100%);
        box-shadow:
          inset 0 2px 2px rgb(255 255 255 / 0.35),
          inset 0 -50px 80px -60px rgb(160 180 255 / 0.7),
          0 46px 70px -34px rgb(27 35 163 / 0.62),
          0 12px 24px -12px rgb(27 35 163 / 0.35);
      }
      .porthole {
        position: absolute;
        right: -110px;
        top: -96px;
        width: 420px;
        height: 420px;
        opacity: 0.3;
        pointer-events: none;
      }
      .tag {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 22px 10px 16px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.16);
        font-weight: 600;
        font-size: 24px;
        line-height: 1.2;
      }
      .tag .dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--mint-dot);
        box-shadow: 0 0 0 5px rgb(127 240 218 / 0.25);
      }
      .when {
        position: relative;
        margin-top: 22px;
        font-weight: 600;
        font-size: 28px;
        line-height: 1.2;
        color: rgb(255 255 255 / 0.8);
      }
      .value {
        position: relative;
        margin: 6px 0 8px -3px;
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 106px;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .who {
        position: relative;
        font-weight: 700;
        font-size: 31px;
        line-height: 1.2;
        letter-spacing: -0.015em;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: 20px;
        margin-top: 46px;
        height: 82px;
        padding: 0 38px 0 40px;
        border-radius: 999px;
        color: #fff;
        background: linear-gradient(180deg, #2b2f38, #0d0f14);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.16),
          0 20px 36px -16px rgb(16 18 23 / 0.6);
        font-weight: 700;
        font-size: 30px;
        letter-spacing: -0.015em;
      }
      .cta svg {
        width: 30px;
        height: 30px;
      }

      .credit {
        position: absolute;
        left: 82px;
        bottom: 46px;
        margin: 0;
        font-weight: 600;
        font-size: 20px;
        color: #8a91a0;
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <header class="top">
        <div class="brand">
          <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="mk-a" x1="0" y1="0" x2=".6" y2="1">
                <stop offset="0" stop-color="#2b2f38" />
                <stop offset="1" stop-color="#0d0f14" />
              </linearGradient>
              <linearGradient id="mk-b" x1="0" y1="0" x2=".7" y2="1">
                <stop offset="0" stop-color="#4250ee" />
                <stop offset="1" stop-color="#1b23a3" />
              </linearGradient>
            </defs>
            <rect width="100" height="100" rx="23" fill="url(#mk-a)" />
            <g fill="#fff" fill-opacity=".16">
              <rect x="20" y="20" width="16" height="16" rx="4.5" />
              <rect x="64" y="20" width="16" height="16" rx="4.5" />
              <rect x="42" y="42" width="16" height="16" rx="4.5" />
              <rect x="20" y="64" width="16" height="16" rx="4.5" />
              <rect x="64" y="64" width="16" height="16" rx="4.5" />
            </g>
            <g fill="#fff">
              <rect x="42" y="20" width="16" height="16" rx="4.5" />
              <rect x="20" y="42" width="16" height="16" rx="4.5" />
              <rect x="42" y="64" width="16" height="16" rx="4.5" />
            </g>
            <rect
              x="64"
              y="42"
              width="16"
              height="16"
              rx="4.5"
              fill="url(#mk-b)"
            />
          </svg>
          <span class="wordmark">єГуртожиток</span>
        </div>
        <span class="new"><b>Нове:</b>Звернення, Дошка, Послуги</span>
      </header>

      <h1 id="headline">
        <span>Звернення</span>
        <span>не губляться</span>
        <span>в <span class="struck">чаті</span></span>
      </h1>

      <p class="sub" id="sub">
        Пишете студраді чи оперзагону — і бачите, хто вже працює над вашою
        справою.
      </p>

      <article class="card">
        <svg class="porthole" viewBox="0 0 200 200" aria-hidden="true">
          <circle
            cx="100"
            cy="100"
            r="96"
            fill="none"
            stroke="#fff"
            stroke-width="2"
          />
          <circle
            cx="100"
            cy="100"
            r="74"
            fill="none"
            stroke="#fff"
            stroke-width="10"
          />
          <circle
            cx="100"
            cy="100"
            r="52"
            fill="none"
            stroke="#fff"
            stroke-width="1.5"
          />
        </svg>
        <span class="tag"><span class="dot"></span>Ваше звернення</span>
        <div class="when">Розетка не працює · 6 поверх, 614</div>
        <div class="value">В роботі</div>
        <div class="who">Виконує: Олена Г.</div>
      </article>

      <div class="cta">
        ehurtozhytok.pages.dev
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#fff"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 12h15M13 6l6 6-6 6" />
        </svg>
      </div>

      <p class="credit">Розробник: @serpanchyk</p>
    </main>

    <script>
      // Variant B: open with #b.
      if (location.hash === "#b") {
        document.getElementById("headline").innerHTML =
          '<span>Відповідь</span><span>замість</span><span><span class="struck">тиші</span></span>';
      }
    </script>
  </body>
</html>
